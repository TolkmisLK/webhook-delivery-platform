openapi: 3.1.0
info:
  title: Webhook Delivery Platform API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Durable webhook endpoint, event, and delivery operations.
    持久化 Webhook Endpoint、事件与投递任务 API。

    Clients may send `X-Request-Id` on any request. Every response echoes the
    effective identifier; unsafe or missing values are replaced with a UUID.
    The 1.x compatibility policy is documented in `docs/api-compatibility.md`.
    客户端可在任意请求中发送 `X-Request-Id`。每个响应都会回传实际使用的标识；
    如果缺失或不安全，则由服务端生成 UUID。1.x 兼容政策见 `docs/api-compatibility.md`。
servers:
  - url: /
security:
  - cookieAuth: []
paths:
  /api/auth/csrf:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: getCsrfToken
      summary: Obtain CSRF metadata / 获取 CSRF 元数据
      security: []
      responses:
        "200":
          description: The current session-bound CSRF token and required request header. / 当前会话绑定的 CSRF Token 及应使用的请求 Header。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfMetadata"
  /api/auth/login:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    post:
      operationId: loginOperator
      summary: Start an operator session / 创建操作者会话
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted and the session identifier rotated. / 凭据通过校验，会话标识已轮换。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSession"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "429":
          $ref: "#/components/responses/LoginRateLimited"
  /api/auth/session:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: getOperatorSession
      summary: Inspect the current operator session / 查询当前操作者会话
      responses:
        "200":
          description: Authenticated operator identity. / 已认证的操作者身份。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/logout:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    post:
      operationId: logoutOperator
      summary: End the operator session / 结束操作者会话
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Session invalidated and authentication cookies cleared. / 会话已失效，认证 Cookie 已清除。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
  /api/endpoints:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: listEndpoints
      summary: List registered endpoints / 查询 Endpoint
      responses:
        "200":
          description: Registered endpoints ordered by creation time. / 按创建时间排序的已注册 Endpoint。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createEndpoint
      summary: Register an endpoint / 注册 Endpoint
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpoint"
      responses:
        "201":
          description: Endpoint created. The signing secret is not returned. / Endpoint 已创建；响应不返回签名密钥。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
  /api/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    put:
      operationId: updateEndpoint
      summary: Update an endpoint name and target URL / 更新 Endpoint 名称与目标 URL
      description: |
        Replaces the live Endpoint name and normalized target URL.
        Deliveries accepted before this update retain their immutable target snapshot.
        替换当前 Endpoint 名称和规范化后的目标 URL。
        更新前已接收的投递仍保留原有不可变目标快照。
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpoint"
      responses:
        "200":
          description: Endpoint updated or already equal after normalization. / Endpoint 已更新，或规范化后与原值相同。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
  /api/endpoints/{endpointId}/status:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    patch:
      operationId: setEndpointStatus
      summary: Activate or deactivate an endpoint / 启用或停用 Endpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEndpointStatus"
      responses:
        "200":
          description: Endpoint status updated or already in the requested state. / Endpoint 状态已更新，或本来就是请求的状态。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
  /api/endpoints/{endpointId}/secret:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    patch:
      operationId: rotateEndpointSecret
      summary: Rotate an endpoint signing secret / 轮换 Endpoint 签名密钥
      description: |
        Replaces the encrypted signing secret for deliveries accepted after this update.
        Deliveries accepted before rotation retain their immutable secret snapshot.
        对轮换后接收的投递使用新的加密签名密钥。
        轮换前已接收的投递仍保留原有不可变密钥快照。
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateEndpointSecret"
      responses:
        "200":
          description: Secret rotated. No secret material is returned. / 密钥已轮换；响应不返回密钥材料。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
  /api/events:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    post:
      operationId: publishEvent
      summary: Accept an event / 接收事件
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishEvent"
      responses:
        "202":
          description: Existing idempotent result or newly persisted delivery job. / 返回已有的幂等结果，或新持久化的投递任务。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/deliveries:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: listDeliveries
      summary: List recent deliveries / 查询最近投递
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent delivery jobs. / 最近的投递任务。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/deliveries/stats:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: getDeliveryStats
      summary: Delivery counts by state / 按状态统计投递
      responses:
        "200":
          description: Delivery counts. / 各投递状态的任务数量。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryStats"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/deliveries/{deliveryId}:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: getDeliveryDetail
      summary: Inspect delivery attempts / 查看投递尝试
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Delivery job and its committed attempt timeline. / 投递任务及已提交的尝试时间线。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/deliveries/{deliveryId}/replay:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    post:
      operationId: replayDelivery
      summary: Queue a delivery for replay / 重新投递
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Delivery returned to PENDING with an extended attempt budget. / 任务回到 PENDING，尝试次数上限已扩展。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/deliveries/{deliveryId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    post:
      operationId: cancelDelivery
      summary: Cancel queued delivery work / 取消排队中的推送任务
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Delivery is CANCELED; repeating the request is idempotent. / 任务进入 CANCELED；重复请求具有幂等性。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DeliveryStateConflict"
  /api/deliveries/stream:
    parameters:
      - $ref: "#/components/parameters/RequestIdHeader"
    get:
      operationId: streamDeliveryUpdates
      summary: Stream delivery state changes / 订阅投递状态
      responses:
        "200":
          description: |
            Server-sent events named `connected` or `delivery`. The JSON value
            in each `data` field conforms to the documented event-data schema.
            SSE 事件名为 `connected` 或 `delivery`；每个 `data` 字段中的 JSON 值
            符合下方记录的事件数据 Schema。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/event-stream:
              schema:
                type: string
                description: UTF-8 SSE frames whose `data` value is JSON. / UTF-8 SSE 帧，其中 `data` 为 JSON 值。
                x-event-data-schema:
                  type: object
                  required: [deliveryId, status, occurredAt]
                  properties:
                    deliveryId:
                      type: [string, "null"]
                      format: uuid
                      description: Null for the initial `connected` event. / 首次 `connected` 事件中为 null。
                    status:
                      type: string
                      enum:
                        [CONNECTED, PENDING, PROCESSING, RETRY_SCHEDULED, SUCCEEDED, DEAD, CANCELED]
                    occurredAt: { type: string, format: date-time }
              example: |
                event: delivery
                data: {"deliveryId":"58cbfdaa-1b54-4b0b-9c8f-d38d74528262","status":"SUCCEEDED","occurredAt":"2026-08-27T12:00:00Z"}
        "401":
          $ref: "#/components/responses/Unauthenticated"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Caller-supplied correlation identifier. Values must contain only ASCII
        letters, digits, `.`, `_`, `:`, or `-`; unsafe or missing values are
        replaced with a UUID and the effective value is returned in every response.
        调用方提供的关联标识只能包含 ASCII 字母、数字、`.`、`_`、`:` 或 `-`；
        如果缺失或不安全，则替换为 UUID，并在每个响应中返回实际使用的值。
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[A-Za-z0-9._:-]+$"
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Session-bound token obtained from `GET /api/auth/csrf`. / 从 `GET /api/auth/csrf` 获取的会话绑定 Token。
      schema:
        type: string
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: Effective request correlation identifier. / 实际使用的请求关联标识。
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[A-Za-z0-9._:-]+$"
  responses:
    Unauthenticated:
      description: No valid operator session. Error code is `unauthenticated`. / 无有效操作者会话；错误码为 `unauthenticated`。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidCredentials:
      description: The supplied credentials are invalid. Error code is `invalid_credentials`. / 提供的凭据无效；错误码为 `invalid_credentials`。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccessDenied:
      description: CSRF validation or authorization failed. Error code is `access_denied`. / CSRF 校验或授权失败；错误码为 `access_denied`。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    LoginRateLimited:
      description: Login quota exceeded. Error code is `login_rate_limited`. / 登录次数超出配额；错误码为 `login_rate_limited`。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds until the rejected quota can be attempted again. / 被拒绝的登录配额恢复前需要等待的秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: Invalid request. / 请求无效。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found. / 资源不存在。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    VersionConflict:
      description: The endpoint version is stale and must be refreshed. / Endpoint 版本已过期，必须刷新后重试。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DeliveryStateConflict:
      description: The delivery is no longer queued and cannot be canceled. / 投递已不在排队状态，无法取消。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
    OperatorSession:
      type: object
      required: [username]
      properties:
        username:
          type: string
    CsrfMetadata:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          example: X-CSRF-TOKEN
        token:
          type: string
    CreateEndpoint:
      type: object
      required: [name, url, secret]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
    UpdateEndpoint:
      type: object
      required: [name, url, expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
        expectedVersion: { type: integer, minimum: 0 }
    SetEndpointStatus:
      type: object
      required: [active, expectedVersion]
      properties:
        active: { type: boolean }
        expectedVersion: { type: integer, minimum: 0 }
    RotateEndpointSecret:
      type: object
      required: [newSecret, expectedVersion]
      properties:
        newSecret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
        expectedVersion: { type: integer, minimum: 0 }
    Endpoint:
      type: object
      required: [id, name, url, active, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        active: { type: boolean }
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    PublishEvent:
      type: object
      required: [endpointId, eventType, idempotencyKey, data]
      properties:
        endpointId: { type: string, format: uuid }
        eventType:
          type: string
          maxLength: 160
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        idempotencyKey: { type: string, maxLength: 200 }
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
    PublishedEvent:
      type: object
      required: [eventId, deliveryId, status, acceptedAt, duplicate]
      properties:
        eventId: { type: string, format: uuid }
        deliveryId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        acceptedAt: { type: string, format: date-time }
        duplicate: { type: boolean }
    Delivery:
      type: object
      required:
        - id
        - eventId
        - eventType
        - endpointName
        - endpointUrl
        - status
        - attemptCount
        - maxAttempts
        - nextAttemptAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        endpointName: { type: string }
        endpointUrl: { type: string, format: uri }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastStatusCode: { type: [integer, "null"] }
        lastError: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeliveryStats:
      type: object
      required: [total, byStatus]
      properties:
        total: { type: integer }
        byStatus:
          type: object
          additionalProperties:
            type: integer
    DeliveryDetail:
      type: object
      required: [delivery, attempts]
      properties:
        delivery: { $ref: "#/components/schemas/Delivery" }
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAttempt"
    DeliveryAttempt:
      type: object
      required: [attemptNumber, outcome, durationMs, startedAt, finishedAt]
      properties:
        attemptNumber: { type: integer, minimum: 1 }
        outcome: { $ref: "#/components/schemas/DeliveryStatus" }
        statusCode: { type: [integer, "null"] }
        errorMessage: { type: [string, "null"] }
        responseExcerpt: { type: [string, "null"] }
        durationMs: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
