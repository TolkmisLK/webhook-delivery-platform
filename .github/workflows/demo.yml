name: Retry demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/demo-retry.mjs'
      - 'examples/demo-receiver.mjs'
      - 'compose.yaml'
      - '.github/workflows/demo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/demo-retry.mjs'
      - 'examples/demo-receiver.mjs'
      - 'compose.yaml'
      - '.github/workflows/demo.yml'

permissions:
  contents: read

concurrency:
  group: retry-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Start local demo
        run: |
          cp .env.example .env
          docker compose up --build --wait --wait-timeout 180
      - name: Run retry example
        run: |
          set -o pipefail
          node --env-file=.env scripts/demo-retry.mjs | tee retry-demo.txt
      - name: Show service health
        if: failure()
        run: |
          docker compose ps -a
          docker compose ps -aq | xargs -r docker inspect --format '{{.Name}} {{json .State.Health}}'
      - name: Receiver results
        if: always()
        run: docker compose logs --no-color receiver
      - name: Save demo output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-demo-output
          path: retry-demo.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop demo
        if: always()
        run: docker compose down --volumes
