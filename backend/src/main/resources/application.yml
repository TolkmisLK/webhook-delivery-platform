spring:
  application:
    name: webhook-delivery-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/webhooks}
    username: ${DATABASE_USERNAME:webhooks}
    password: ${DATABASE_PASSWORD:webhooks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  delivery:
    poll-interval: ${APP_DELIVERY_POLL_INTERVAL:1s}
    request-timeout: ${APP_DELIVERY_REQUEST_TIMEOUT:5s}
    base-retry-delay: ${APP_DELIVERY_BASE_RETRY_DELAY:5s}
    max-retry-delay: ${APP_DELIVERY_MAX_RETRY_DELAY:5m}
    lease-timeout: ${APP_DELIVERY_LEASE_TIMEOUT:30s}
    metrics-refresh-interval: ${APP_DELIVERY_METRICS_REFRESH_INTERVAL:5s}
    batch-size: ${APP_DELIVERY_BATCH_SIZE:10}
    worker-concurrency: ${APP_DELIVERY_WORKER_CONCURRENCY:8}
    max-attempts: ${APP_DELIVERY_MAX_ATTEMPTS:5}
    max-response-bytes: ${APP_DELIVERY_MAX_RESPONSE_BYTES:4096}
    worker-id: ${APP_DELIVERY_WORKER_ID:worker-1}
  security:
    allow-private-targets: ${APP_SECURITY_ALLOW_PRIVATE_TARGETS:false}
    allowed-ports: ${APP_SECURITY_ALLOWED_PORTS:80,443}
    master-key: ${APP_SECURITY_MASTER_KEY:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-} traceId=%X{traceId:-}]"
