name: webhook-delivery-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 10

  receiver:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "demo-receiver.mjs"]
    environment:
      PORT: 8090
      WEBHOOK_SIGNING_SECRET: ${DEMO_WEBHOOK_SECRET:-local-demo-secret}
    volumes:
      - ./examples/demo-receiver.mjs:/app/demo-receiver.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/webhooks
      DATABASE_USERNAME: webhooks
      DATABASE_PASSWORD: webhooks
      APP_SECURITY_MASTER_KEY: ${APP_SECURITY_MASTER_KEY}
      APP_SECURITY_ALLOW_PRIVATE_TARGETS: "true"
      APP_SECURITY_ALLOWED_PORTS: 80,443,8090
      APP_OPERATOR_USERNAME: ${APP_OPERATOR_USERNAME:-admin}
      APP_OPERATOR_PASSWORD: ${APP_OPERATOR_PASSWORD:-local-admin-password}
      APP_OPERATOR_COOKIE_SECURE: ${APP_OPERATOR_COOKIE_SECURE:-false}
      APP_OPERATOR_SESSION_TIMEOUT: ${APP_OPERATOR_SESSION_TIMEOUT:-30m}
      APP_OPERATOR_LOGIN_CLIENT_MAX_ATTEMPTS: ${APP_OPERATOR_LOGIN_CLIENT_MAX_ATTEMPTS:-8}
      APP_OPERATOR_LOGIN_GLOBAL_MAX_ATTEMPTS: ${APP_OPERATOR_LOGIN_GLOBAL_MAX_ATTEMPTS:-64}
      APP_OPERATOR_LOGIN_WINDOW: ${APP_OPERATOR_LOGIN_WINDOW:-1m}
      APP_OPERATOR_LOGIN_CLIENT_BLOCK_DURATION: ${APP_OPERATOR_LOGIN_CLIENT_BLOCK_DURATION:-5m}
      APP_OPERATOR_LOGIN_GLOBAL_BLOCK_DURATION: ${APP_OPERATOR_LOGIN_GLOBAL_BLOCK_DURATION:-1m}
      APP_OPERATOR_LOGIN_MAX_CLIENT_ENTRIES: ${APP_OPERATOR_LOGIN_MAX_CLIENT_ENTRIES:-1024}
      APP_DELIVERY_WORKER_ID: docker-worker-1
      APP_DELIVERY_WORKER_CONCURRENCY: 4
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:
